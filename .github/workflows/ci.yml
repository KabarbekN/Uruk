name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp spotless:check verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.27.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm audit --prod --audit-level=high
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm exec playwright test e2e/workspace.spec.ts
        working-directory: frontend
  parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r analyzers/tree-sitter/requirements.txt -r analyzers/postgresql/requirements.txt
      - run: python -m unittest discover -s analyzers/shared/tests -v
      - run: python -m unittest discover -s analyzers/tree-sitter/tests -v
      - run: python -m unittest discover -s analyzers/postgresql/tests -v
      - run: npm ci --ignore-scripts
        working-directory: analyzers/typescript-node
      - run: npm test
        working-directory: analyzers/typescript-node
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, parsers]
    steps:
      - uses: actions/checkout@v4
      - run: make analyzers
      - run: docker build -f deploy/docker/platform.Dockerfile -t semanticmap/platform:0.1.0 .
      - run: docker build -f frontend/Dockerfile -t semanticmap/frontend:0.1.0 .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r analyzers/shared/requirements.txt
      - run: python analyzers/shared/container_smoke.py tree-sitter
      - run: python analyzers/shared/container_smoke.py postgresql
      - run: python analyzers/shared/container_smoke.py typescript-node
      - uses: pnpm/action-setup@v4
        with:
          version: '10.27.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: mkdir -p .runtime/artifacts
      - name: Start local acceptance stack
        run: docker compose up -d --no-build
        env:
          ARTIFACT_HOST_PATH: ${{ github.workspace }}/.runtime/artifacts
      - name: Wait for API
        run: curl --fail --retry 30 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/actuator/health
      - name: Evidence and semantic diff acceptance
        run: node scripts/e2e.mjs
        env:
          E2E_API_URL: http://127.0.0.1:8080
          E2E_UI_URL: http://127.0.0.1:8088
          E2E_FIXTURE_ROOT: /repository/fixtures
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance
          path: output/playwright
      - name: Stop acceptance services
        if: always()
        run: docker compose down
      - name: Scan platform image dependencies
        uses: anchore/scan-action@v7
        with:
          image: semanticmap/platform:0.1.0
          severity-cutoff: high
          output-format: table
      - name: Scan frontend image dependencies
        uses: anchore/scan-action@v7
        with:
          image: semanticmap/frontend:0.1.0
          severity-cutoff: high
          output-format: table
      - name: Scan Java analyzer image dependencies
        uses: anchore/scan-action@v7
        with:
          image: semanticmap/java-spring:0.1.0
          severity-cutoff: high
          output-format: table
      - name: Scan Tree-sitter analyzer image dependencies
        uses: anchore/scan-action@v7
        with:
          image: semanticmap/tree-sitter:0.1.0
          severity-cutoff: high
          output-format: table
      - name: Scan PostgreSQL analyzer image dependencies
        uses: anchore/scan-action@v7
        with:
          image: semanticmap/postgresql:0.1.0
          severity-cutoff: high
          output-format: table
      - name: Scan TypeScript analyzer image dependencies
        uses: anchore/scan-action@v7
        with:
          image: semanticmap/typescript-node:0.1.0
          severity-cutoff: high
          output-format: table
