name: semanticmap
services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: semanticmap
      POSTGRES_USER: semanticmap
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-semanticmap-local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semanticmap -d semanticmap"]
      interval: 3s
      timeout: 3s
      retries: 30
  platform-api:
    build:
      context: .
      dockerfile: deploy/docker/platform.Dockerfile
    image: semanticmap/platform:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/semanticmap
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-semanticmap-local}
      SERVER_ADDRESS: 0.0.0.0
      WORKER_ENABLED: "false"
      ARTIFACT_ROOT: /artifacts
      REPOSITORY_ROOTS: /repository
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/repository:ro
      - ${ARTIFACT_HOST_PATH:-./.runtime/artifacts}:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
  platform-worker:
    image: semanticmap/platform:0.1.0
    user: "${WORKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      SPRING_PROFILES_ACTIVE: dev,worker
      DATABASE_URL: jdbc:postgresql://postgres:5432/semanticmap
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-semanticmap-local}
      WORKER_ENABLED: "true"
      ARTIFACT_ROOT: /artifacts
      REPOSITORY_ROOTS: /repository
      SEMANTIC_ARTIFACT_HOST_PATH: ${ARTIFACT_HOST_PATH:-}
    volumes:
      - .:/repository:ro
      - ${ARTIFACT_HOST_PATH:-./.runtime/artifacts}:/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      platform-api:
        condition: service_started
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: semanticmap/frontend:0.1.0
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - platform-api
volumes:
  postgres-data:
